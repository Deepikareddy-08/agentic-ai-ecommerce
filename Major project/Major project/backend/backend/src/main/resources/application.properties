spring.application.name=backend

# PostgreSQL Database Connection Settings (Overridable via environment variables)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:deepika08}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hikari Connection Pool Resilience & Auto-Reconnect
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External Microservice URLs
ml.service.url=${ML_SERVICE_URL:http://localhost:8001}
ai.service.url=${AI_SERVICE_URL:http://localhost:8002}

# Server Port
server.port=${SERVER_PORT:8080}
